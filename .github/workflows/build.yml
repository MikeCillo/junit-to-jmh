name: Java CI with Gradle

# The pipeline triggers on every push to main, master and dependability
on:
  push:
    branches: [ "main", "master", "dependability" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Get the source code from repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # setup java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # grant execute permission to Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the project and run the test suite
      - name: Build with Gradle
        run: ./gradlew build

      # Continuous Delivery (CD) save .jar on GitHub
      - name: Upload executable artifact (CD)
        uses: actions/upload-artifact@v4
        with:
          name: ju2jmh-executable
          path: '**/build/libs/*.jar'

      - name: Download OpenJML (Linux)
        run: |
          wget https://github.com/OpenJML/OpenJML/releases/download/21-0.23/openjml-ubuntu-22.04-21-0.23.zip -O openjml.zip
          unzip openjml.zip -d openjml_tool

      - name: Verify JML Contracts
        run: |
          JARS=$(find ~/.gradle/caches/ -name "*.jar" | tr '\n' ':')
          # Aggiunta la cartella api/build/classes/java/main al classpath
          CP="api/build/classes/java/main:converter/build/classes/java/main:$JARS"
          ./openjml_tool/openjml -esc -cp "$CP" converter/src/main/java/se/chalmers/ju2jmh/Converter.java || true

      # --- SECURITY MECHANISMS ---

      # 1. Secret Scanning (GitGuardian)
      - name: GitGuardian Secret Scan
        uses: GitGuardian/ggshield-action@v1.33.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: true

      # 2. Static Application Security Testing - SAST (SonarQube)
      - name: SonarQube Security Analysis
        run: ./gradlew sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      # 3. Software Composition Analysis - SCA (Snyk Vulnerability Scan)
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/setup@master
      - name: Snyk Monitor
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true